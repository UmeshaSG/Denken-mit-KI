<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<style>
  :root {
    --navy: #0b1a2e;
    --navy-2: #10233d;
    --navy-3: #16304f;
    --cyan: #5ad1e6;
    --cyan-dim: #3a8fa0;
    --gold: #d9a441;
    --ink: #e6eef6;
    --ink-dim: #9fb3c8;
    --grid: rgba(90, 209, 230, 0.06);
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background-color: var(--navy);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.7;
  }
  .sheet {
    position: relative;
    max-width: 760px;
    margin: 48px auto;
    padding: 56px 48px 64px;
    background: rgba(11, 26, 46, 0.85);
    border: 1px solid rgba(90, 209, 230, 0.25);
  }
  .reg { position: absolute; width: 22px; height: 22px; border-color: var(--cyan); border-style: solid; }
  .reg.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .reg.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .reg.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .reg.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(38px, 6vw, 54px);
    line-height: 1.1;
    margin: 12px 0 14px;
  }
  .tagline {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--gold);
    margin: 0 0 8px;
  }
  .meta { color: var(--ink-dim); font-size: 14px; margin: 0 0 40px; }
  h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    margin: 56px 0 12px;
    padding-top: 20px;
    border-top: 1px solid rgba(90, 209, 230, 0.2);
  }
  h3 {
    font-family: var(--sans);
    font-size: 19px;
    font-weight: 600;
    margin: 32px 0 6px;
    color: var(--ink);
  }
  h3 .num { font-family: var(--mono); color: var(--cyan); font-weight: 400; margin-right: 8px; }
  p { margin: 0 0 16px; }
  .lede p { font-size: 20px; }
  .principle {
    margin: 32px 0;
    padding: 20px 24px;
    border-left: 3px solid var(--gold);
    background: var(--navy-2);
    font-family: var(--serif);
    font-size: 24px;
  }
  ul { padding-left: 22px; margin: 0 0 16px; }
  li { margin-bottom: 8px; }
  .check {
    display: block;
    margin: 12px 0 0;
    padding: 10px 14px;
    background: var(--navy-2);
    border: 1px dashed var(--cyan-dim);
    font-size: 16px;
    color: var(--ink);
  }
  .check::before { content: "Done right when: "; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); }
  .loop {
    margin: 28px 0;
    padding: 4px 24px 20px;
    border: 1px dashed var(--gold);
  }
  .loop .label { color: var(--gold); display: block; margin-top: 16px; }
  figure { margin: 40px 0; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 14px; color: var(--ink-dim); margin-top: 10px; font-family: var(--mono); }
  .signs li::marker { color: var(--gold); }
  a { color: var(--cyan); text-underline-offset: 3px; }
  .refs { font-size: 15px; color: var(--ink-dim); }
  .refs li { margin-bottom: 6px; }
  footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid rgba(90, 209, 230, 0.2);
    font-size: 14px;
    color: var(--ink-dim);
  }
  @media (max-width: 640px) {
    body { font-size: 17px; }
    .sheet { margin: 0; padding: 40px 22px 48px; border-left: none; border-right: none; }
    .lede p { font-size: 18px; }
    .principle { font-size: 21px; }
  }
  .back { font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; display: inline-block; margin-bottom: 28px; text-decoration: none; }
  .comments { margin-top: 56px; padding-top: 20px; border-top: 1px solid rgba(90, 209, 230, 0.2); }
  .comments-title { border-top: none; margin-top: 0; padding-top: 0; }
  .utterances { max-width: 100%; }
</style>
</head>
<body>
<main class="sheet">
  <span class="reg tl"></span><span class="reg tr"></span><span class="reg bl"></span><span class="reg br"></span>
  <a class="back" href="{{ '/' | relative_url }}">&larr; {{ site.title }}</a>
{{ content }}
{% include comments.html theme="github-dark" %}
</main>
</body>
</html>
